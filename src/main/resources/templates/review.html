<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review page</title>

  <style>
    :root {
      --bg:       #0b1020;
      --accent:   #5eead4;
      --accent-2: #38bdf8;
      --text:     #e8eefc;
      --muted:    #93a4c4;
      --ok:       #5eead4;
      --mid:      #fbbf24;
      --bad:      #fb7185;
      --panel:    rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 0%,
                  #16224a 0%, var(--bg) 55%, #05070f 100%);
    }

    /* ---------- Stage ---------- */
    .stage {
      width: min(100%, 640px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 .25rem;
    }

    .brand {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .counter {
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Card ---------- */
    .card {
      border: 3px solid var(--accent);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 0 40px rgba(94, 234, 212, .15);
      padding: 2.25rem 1.75rem;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      text-align: center;
    }

    .prompt {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: clamp(3.25rem, 16vw, 6rem);
      line-height: 1.1;
      letter-spacing: .06em;
      font-weight: 700;
      color: #f4faff;
      text-shadow: 0 0 28px rgba(94, 234, 212, .35);
      word-break: break-word;
    }

    .hint {
      margin: 0;
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---------- Reveal ---------- */
    .reveal {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border-top: 1px solid rgba(94, 234, 212, .18);
      padding-top: 1.4rem;
      animation: fade-in .25s ease both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .rating-pill {
      align-self: center;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      padding: .35rem .85rem;
      border-radius: 999px;
      border: 1px solid currentColor;
    }
    .rating-pill.forgot   { color: var(--bad); }
    .rating-pill.partial  { color: var(--mid); }
    .rating-pill.remember { color: var(--ok); }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      justify-content: center;
    }

    .chip {
      font-size: .7rem;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: .3rem .65rem;
      border-radius: 999px;
      border: 1px solid rgba(94, 234, 212, .25);
      background: rgba(94, 234, 212, .08);
      color: #a9f2e4;
    }

    .chip.level {
      border: none;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #05121a;
      font-weight: 700;
    }

    .form-block {
      width: 100%;
      text-align: left;
      padding: .9rem 1rem;
      border-radius: 16px;
      background: rgba(94, 234, 212, .06);
      border: 1px solid rgba(94, 234, 212, .15);
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }

    .form-head {
      display: flex;
      align-items: baseline;
      gap: .6rem;
      flex-wrap: wrap;
    }

    .form-trad {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .form-pinyin {
      font-size: 1rem;
      color: var(--accent-2);
      letter-spacing: .02em;
    }

    .meanings {
      margin: 0;
      padding-left: 1.15rem;
      font-size: .95rem;
      line-height: 1.5;
      color: var(--text);
    }

    .meanings li::marker { color: var(--accent); }

    .classifiers {
      font-size: .82rem;
      color: var(--muted);
    }
    .classifiers .label { color: rgba(147, 164, 196, .75); }

    .words {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      text-align: left;
    }

    .section-label {
      font-size: .7rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .word-list {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .word-chip {
      display: inline-flex;
      align-items: baseline;
      gap: .45rem;
      flex-wrap: wrap;
      padding: .4rem .75rem;
      border-radius: 12px;
      background: rgba(56, 189, 248, .08);
      border: 1px solid rgba(56, 189, 248, .2);
      font-size: .82rem;
    }

    .wc-main {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 1rem;
      font-weight: 600;
    }
    .wc-py   { color: var(--accent-2); }
    .wc-mean { color: var(--muted); }

    /* ---------- Summary ---------- */
    .summary { gap: 1.5rem; }

    .summary-title {
      margin: 0;
      font-size: clamp(1.5rem, 4.5vw, 2rem);
      font-weight: 800;
      letter-spacing: .03em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .summary-sub {
      margin: -.5rem 0 0;
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .6rem;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      padding: .9rem .4rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(94, 234, 212, .15);
    }

    .stat-value { font-size: 1.75rem; font-weight: 800; line-height: 1.1; }

    .stat-label {
      font-size: .65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat.remember .stat-value { color: var(--ok); }
    .stat.partial  .stat-value { color: var(--mid); }
    .stat.forgot   .stat-value { color: var(--bad); }

    .summary-btn { width: 100%; max-width: 260px; margin-top: .25rem; }

    /* ---------- Controls ---------- */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: .6rem;
    }
    .controls.one { grid-template-columns: 1fr; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: .8rem 1rem;
      font-family: inherit;
      font-size: .92rem;
      font-weight: 600;
      letter-spacing: .02em;
      border-radius: 999px;
      border: 2px solid transparent;
      background: transparent;
      text-decoration: none;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease,
                  background .15s ease, color .15s ease;
    }

    .btn:hover  { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 3px;
    }

    .rate.forgot   { border-color: rgba(251, 113, 133, .55); color: var(--bad); }
    .rate.forgot:hover   { background: rgba(251, 113, 133, .12); }

    .rate.partial  { border-color: rgba(251, 191, 36, .55); color: var(--mid); }
    .rate.partial:hover  { background: rgba(251, 191, 36, .12); }

    .rate.remember { border-color: rgba(94, 234, 212, .6); color: var(--ok); }
    .rate.remember:hover { background: rgba(94, 234, 212, .12); }

    .btn-primary {
      color: #05121a;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px rgba(56, 189, 248, .3);
    }
    .btn-primary:hover { box-shadow: 0 12px 30px rgba(56, 189, 248, .45); }

    .kbd-hint {
      margin: 0;
      text-align: center;
      font-size: .72rem;
      letter-spacing: .06em;
      color: rgba(147, 164, 196, .65);
    }

    .kbd-hint kbd {
      font-family: inherit;
      font-size: .7rem;
      padding: .1rem .35rem;
      border-radius: 5px;
      border: 1px solid rgba(147, 164, 196, .35);
      background: rgba(255, 255, 255, .05);
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 1.75rem 1.25rem; }
      .btn  { font-size: .82rem; padding: .7rem .5rem; }
      .stat-value { font-size: 1.4rem; }
    }
  </style>
</head>

<body>

  <main class="stage">
    <header class="topbar">
      <a class="brand" href="/">知路</a>
      <span class="counter" id="counter">Card 0 · 0 reviewed</span>
    </header>

    <!-- Main study card -->
    <section class="card" id="card" aria-live="polite">
      <div class="prompt" id="prompt">…</div>
      <p class="hint" id="hint">Do you remember this word?</p>
      <div class="reveal" id="reveal" hidden></div>
    </section>

    <!-- Session summary -->
    <section class="card summary" id="summary" hidden>
      <h2 class="summary-title" id="summaryTitle">Session complete</h2>
      <p class="summary-sub" id="summarySub">0 cards reviewed</p>

      <div class="stats" id="stats">
        <div class="stat remember">
          <span class="stat-value" id="statRemember">0</span>
          <span class="stat-label">Remembered</span>
        </div>
        <div class="stat partial">
          <span class="stat-value" id="statPartial">0</span>
          <span class="stat-label">Partial</span>
        </div>
        <div class="stat forgot">
          <span class="stat-value" id="statForgot">0</span>
          <span class="stat-label">Forgot</span>
        </div>
      </div>

      <a class="btn btn-primary summary-btn" href="/">Back to main</a>
    </section>

    <div class="controls" id="ratingControls" hidden>
      <button class="btn rate forgot"   type="button" data-rating="forgot">Forgot</button>
      <button class="btn rate partial"  type="button" data-rating="partial">Partial</button>
      <button class="btn rate remember" type="button" data-rating="remember">Remember</button>
    </div>

    <div class="controls one" id="nextControls" hidden>
      <button class="btn btn-primary" type="button" id="nextBtn">Next card</button>
    </div>

    <p class="kbd-hint" id="kbdHint" hidden></p>
  </main>

  <script>
  (() => {
    'use strict';

    const API = {
      cards:  '/api/cards/random',
      review: '/api/reviews'
    };

    /* How many cards to request per batch (server default is 20 anyway). */
    const BATCH_SIZE = 20;

    const RATINGS = {
      forgot:   { grade: 1, label: 'Forgot' },
      partial:  { grade: 2, label: 'Partial' },
      remember: { grade: 3, label: 'Remember' }
    };

    const POS_LABELS = {
      a: 'adjective', n: 'noun',     v: 'verb',       d: 'adverb',
      p: 'preposition', c: 'conjunction', m: 'numeral', q: 'classifier',
      r: 'pronoun', t: 'time word',  f: 'direction',  s: 'place',
      x: 'other'
    };

    /* Test cards. */
    const SAMPLE_CARDS = [
      {
        simplified: '好吃',
        level: '1',
        frequency: 2484,
        pos: ['a'],
        forms: [
          { traditional: '好吃', pinyin: 'hǎo chī', meanings: ['tasty', 'delicious'], classifiers: [] },
          { traditional: '好吃', pinyin: 'hào chī', meanings: ['to be fond of eating', 'to be gluttonous'], classifiers: [] }
        ],
        words: []
      },
      {
        simplified: '书',
        level: '1',
        frequency: 210,
        pos: ['n'],
        forms: [
          { traditional: '書', pinyin: 'shū', meanings: ['book', 'letter', 'document'], classifiers: ['本 běn', '册 cè'] }
        ],
        words: [
          { simplified: '书店', pinyin: 'shū diàn', meanings: ['bookstore'] },
          { simplified: '看书', pinyin: 'kàn shū', meanings: ['to read'] }
        ]
      },
      {
        simplified: '银行',
        level: '2',
        frequency: 1213,
        pos: ['n'],
        forms: [
          { traditional: '銀行', pinyin: 'yín háng', meanings: ['bank'], classifiers: ['家 jiā'] }
        ],
        words: [
          { simplified: '银行卡', pinyin: 'yín háng kǎ', meanings: ['bank card'] }
        ]
      },
      {
        simplified: '谢谢',
        level: '1',
        frequency: 340,
        pos: ['v'],
        forms: [
          { traditional: '謝謝', pinyin: 'xiè xie', meanings: ['thank you', 'thanks'], classifiers: [] }
        ],
        words: [
          { simplified: '不客气', pinyin: 'bú kè qi', meanings: ["you're welcome"] }
        ]
      }
    ];

    /* ---------------- DOM ---------------- */
    const cardEl         = document.getElementById('card');
    const promptEl       = document.getElementById('prompt');
    const hintEl         = document.getElementById('hint');
    const revealEl       = document.getElementById('reveal');
    const counterEl      = document.getElementById('counter');
    const ratingControls = document.getElementById('ratingControls');
    const nextControls   = document.getElementById('nextControls');
    const nextBtn        = document.getElementById('nextBtn');
    const kbdHint        = document.getElementById('kbdHint');

    const summaryEl      = document.getElementById('summary');
    const summaryTitle   = document.getElementById('summaryTitle');
    const summarySub     = document.getElementById('summarySub');
    const statRemember   = document.getElementById('statRemember');
    const statPartial    = document.getElementById('statPartial');
    const statForgot     = document.getElementById('statForgot');
    const statsEl        = document.getElementById('stats');

    /* ---------------- State ---------------- */
    const state = {
      deck: [],            // cards remaining in the current batch
      batchTotal: 0,       // size of the batch as received
      card: null,          // card currently on screen
      revealed: false,
      loading: false,
      finished: false,
      shown: 0,
      lastRating: null,
      results: { forgot: 0, partial: 0, remember: 0 }
    };

    const reviewedCount = () => {
      const r = state.results;
      return r.forgot + r.partial + r.remember;
    };

    /* ---------------- Tiny DOM helpers ---------------- */
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function chip(text, cls) {
      return el('span', 'chip' + (cls ? ' ' + cls : ''), text);
    }

    const KBD_HINTS = {
      rate: '<kbd>1</kbd> forgot · <kbd>2</kbd> partial · <kbd>3</kbd> remember',
      next: '<kbd>Space</kbd> next card'
    };

    function setKbdHint(mode) {
      const html = KBD_HINTS[mode];
      if (html) {
        kbdHint.innerHTML = html;
        kbdHint.hidden = false;
      } else {
        kbdHint.replaceChildren();
        kbdHint.hidden = true;
      }
    }

    /* Batch loading */
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /* One request -> array of cards (or [] when there is nothing to study). */
    async function fetchBatch() {
      try {
        const res = await fetch(`${API.cards}?count=${BATCH_SIZE}`, {
          headers: { Accept: 'application/json' }
        });

        // A proper "nothing to study" answer.
        if (res.status === 204) return [];

        // 404 / 500 / SPA HTML fallbacks mean the endpoint isn't there yet:
        // use the local sample deck instead of ending the session.
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('json')) {
          throw new Error('not JSON (' + (contentType || 'no content-type') + ')');
        }

        const data = await res.json();

        if (Array.isArray(data)) {
          return data.filter(card => card && card.simplified);
        }

        throw new Error('unexpected payload shape');
      } catch (err) {
        console.info('[test-run] falling back to local sample deck —', err.message);
        return shuffle(SAMPLE_CARDS.slice());
      }
    }

    /* Full card */
    function formBlock(form, card) {
      const box = el('div', 'form-block');

      const head = el('div', 'form-head');
      head.append(el('span', 'form-trad', form.traditional || card.simplified || ''));
      if (form.pinyin) head.append(el('span', 'form-pinyin', form.pinyin));
      box.append(head);

      if (form.meanings && form.meanings.length) {
        const list = el('ul', 'meanings');
        form.meanings.forEach(m => list.append(el('li', null, m)));
        box.append(list);
      }

      if (form.classifiers && form.classifiers.length) {
        const cl = el('div', 'classifiers');
        cl.append(el('span', 'label', 'Classifier: '));
        cl.append(el('span', null, form.classifiers.join(' · ')));
        box.append(cl);
      }

      return box;
    }

    function wordChip(item) {
      if (typeof item === 'string') return el('span', 'word-chip', item);

      const c = el('span', 'word-chip');
      const main = item.simplified || item.traditional || item.word || '';
      if (main) c.append(el('span', 'wc-main', main));
      if (item.pinyin) c.append(el('span', 'wc-py', item.pinyin));

      const meanings = (item.meanings || []).join('; ');
      if (meanings) c.append(el('span', 'wc-mean', meanings));

      if (!c.children.length) c.textContent = JSON.stringify(item);
      return c;
    }

    function buildReveal(card, rating) {
      const frag = document.createDocumentFragment();

      if (rating && RATINGS[rating]) {
        frag.append(el('div', 'rating-pill ' + rating, RATINGS[rating].label));
      }

      const meta = el('div', 'meta');
      if (card.level) meta.append(chip('HSK ' + card.level, 'level'));
      if (typeof card.frequency === 'number') meta.append(chip('#' + card.frequency));
      (card.pos || []).forEach(p => {
        const c = chip(POS_LABELS[p] || p);
        c.title = p;
        meta.append(c);
      });
      if (meta.children.length) frag.append(meta);

      const forms = (card.forms && card.forms.length)
        ? card.forms
        : [{
            traditional: card.traditional || card.simplified,
            pinyin: card.pinyin || '',
            meanings: card.meanings || [],
            classifiers: card.classifiers || []
          }];
      forms.forEach(f => frag.append(formBlock(f, card)));

      if (card.words && card.words.length) {
        const wrap = el('div', 'words');
        wrap.append(el('div', 'section-label', 'Related words'));
        const list = el('div', 'word-list');
        card.words.forEach(w => list.append(wordChip(w)));
        wrap.append(list);
        frag.append(wrap);
      }

      return frag;
    }

    async function init() {
      state.loading = true;
      promptEl.textContent = '…';
      hintEl.hidden = true;
      counterEl.textContent = 'Loading…';

      const cards = await fetchBatch();
      state.deck = cards;
      state.batchTotal = cards.length;
      state.loading = false;

      if (!cards.length) {
        showSummary();
        return;
      }

      showNext();
    }

    function showNext() {
      if (state.loading || state.finished) return;

      promptEl.textContent = '…';
      hintEl.hidden = true;
      revealEl.hidden = true;
      revealEl.replaceChildren();
      ratingControls.hidden = true;
      nextControls.hidden = true;
      setKbdHint(null);

      const card = state.deck.shift();   // pull from the loaded batch
      if (!card) {                       // batch exhausted
        showSummary();
        return;
      }

      state.card = card;
      state.revealed = false;
      state.lastRating = null;
      state.shown++;

      promptEl.textContent = card.simplified || '—';
      hintEl.hidden = false;
      ratingControls.hidden = false;
      setKbdHint('rate');
      updateCounter();
    }

    function reveal() {
      if (state.revealed || !state.card) return;
      state.revealed = true;

      hintEl.hidden = true;
      revealEl.replaceChildren(buildReveal(state.card, state.lastRating));
      revealEl.hidden = false;
      ratingControls.hidden = true;
      nextControls.hidden = false;
      setKbdHint('next');
      nextBtn.focus({ preventScroll: true });
    }

    function rate(rating) {
      if (state.revealed || state.finished || !state.card) return;

      const meta = RATINGS[rating];
      if (!meta) return;

      state.lastRating = rating;
      state.results[rating] += 1;
      updateCounter();

      submitReview({
        simplified: state.card.simplified,
        level: state.card.level ?? null,
        grade: meta.grade,
        reviewedAt: new Date().toISOString()
      });

      reveal();
    }

    function updateCounter() {
      const reviewed = reviewedCount();
      const total = state.batchTotal;
      counterEl.textContent = total
        ? `Card ${state.shown} / ${total} · ${reviewed} reviewed`
        : `${reviewed} reviewed`;
    }

    /* Summary screen */
    function showSummary() {
      state.finished = true;

      cardEl.hidden = true;
      ratingControls.hidden = true;
      nextControls.hidden = true;
      setKbdHint(null);

      const total = reviewedCount();

      summaryTitle.textContent = total ? 'Session complete' : 'No cards available';
      summarySub.textContent = total
        ? `${total} card${total === 1 ? '' : 's'} reviewed`
        : 'Nothing to study right now';

      statRemember.textContent = state.results.remember;
      statPartial.textContent  = state.results.partial;
      statForgot.textContent   = state.results.forgot;
      statsEl.hidden = total === 0;

      counterEl.textContent = 'Session complete';
      summaryEl.hidden = false;
    }
    const offlineQueue = [];

    async function submitReview(payload) {
      try {
        const res = await fetch(API.review, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        console.debug('[test-run] review sent', payload);
      } catch (err) {
        offlineQueue.push(payload);
        console.warn('[test-run] review kept locally —', err.message, payload);
      }
    }

    /* Events */
    ratingControls.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-rating]');
      if (btn) rate(btn.dataset.rating);
    });

    nextBtn.addEventListener('click', showNext);

    document.addEventListener('keydown', (e) => {
      if (e.repeat || e.altKey || e.ctrlKey || e.metaKey) return;
      if (state.loading || state.finished) return;

      const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
      if ((e.key === 'Enter' || e.key === ' ') && onButton) return;

      if (state.revealed) {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          showNext();
        }
        return;
      }

      const keyMap = { '1': 'forgot', '2': 'partial', '3': 'remember' };
      if (keyMap[e.key]) {
        e.preventDefault();
        rate(keyMap[e.key]);
      }
    });

    init();
  })();
  </script>

</body>
</html>
