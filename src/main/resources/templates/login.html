<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="|${title}|"></title>

  <style>
    :root {
      --bg:        #0b1020;
      --accent:    #5eead4;
      --accent-2:  #38bdf8;
      --text:      #e8eefc;
      --muted:     #93a4c4;
      --field-bg:  rgba(255, 255, 255, 0.05);
      --field-border: rgba(94, 234, 212, 0.25);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 0%,
                  #16224a 0%, var(--bg) 55%, #05070f 100%);
    }

    .square {
      width: min(90vw, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      padding: 2.5rem 2rem;
      text-align: center;
      border: 3px solid var(--accent);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: 0 0 30px rgba(94, 234, 212, 0.15);
    }

    .site-title {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: left;
    }

    .field label {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: var(--field-bg);
      border: 2px solid var(--field-border);
      border-radius: 12px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .field input::placeholder { color: rgba(147, 164, 196, 0.5); }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.2);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      margin-top: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.9rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.03em;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease,
                  background 0.18s ease, color 0.18s ease;
    }

    .btn:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 3px;
    }

    .btn-primary {
      border: 2px solid transparent;
      color: #05121a;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.30);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.45);
    }

    .btn-secondary {
      border: 2px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      background: rgba(94, 234, 212, 0.12);
      box-shadow: 0 12px 30px rgba(94, 234, 212, 0.20);
    }

    .btn:active { transform: translateY(0); }

    @media (max-width: 480px) {
      .square { padding: 2rem 1.5rem; }
    }
  </style>
</head>

<body>
  <main class="square">
    <h1 class="site-title">知路</h1>

    <form action="/login" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="name" name="name" type="text"
               placeholder="Enter your username"
               autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="Enter your password"
               autocomplete="current-password" required />
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="submit">Log In</button>
        <a class="btn btn-secondary" href="/">Back</a>
      </div>
    </form>
  </main>

</body>
</html>
