<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, text/html; charset=UTF-8" />
  <title th:text="|${title}|"></title>

  <style>
    :root {
      --bg:        #0b1020;
      --accent:    #5eead4;
      --accent-2:  #38bdf8;
      --text:      #e8eefc;
      --muted:     #93a4c4;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 0%,
                  #16224a 0%, var(--bg) 55%, #05070f 100%);
    }

    .square {
      width: min(90vw, 420px);
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      text-align: center;
      border: 3px solid var(--accent);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      box-shadow: 0 0 30px rgba(94, 234, 212, 0.15);
    }

    .site-title {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.15;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 220px;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        width: 100%;
        padding: 0.9rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        letter-spacing: 0.03em;
        border-radius: 999px;
        cursor: pointer;
        transition: transform 0.18s ease, box-shadow 0.18s ease,
        background 0.18s ease, color 0.18s ease;
    }

    .btn:focus-visible {
      outline: 3px solid var(--accent-2);
      outline-offset: 3px;
    }

    .btn-primary {
      border: 2px solid transparent;
      color: #05121a;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.30);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.45);
    }

    .btn-secondary {
      border: 2px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      background: rgba(94, 234, 212, 0.12);
      box-shadow: 0 12px 30px rgba(94, 234, 212, 0.20);
    }

    .btn:active { transform: translateY(0); }

    @media (max-width: 480px) {
      .square {
        aspect-ratio: auto;
        min-height: 360px;
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>

<body>

  <main class="square">
    <h1 class="site-title">知路</h1>
    <p th:if="${name != null}">
    Logged in as <span th:text="${name}">user</span>
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="login">Log In</a>
      <a class="btn btn-secondary" href="review">Test Run</a>
    </div>
  </main>

</body>
</html>
